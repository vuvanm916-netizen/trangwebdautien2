<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Nền chuyển màu động */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 380px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .status-dot {
            width: 15px;
            height: 15px;
            background-color: #2ecc71;
            border: 2px solid white;
            border-radius: 50%;
            position: absolute;
            bottom: 5px;
            right: 5px;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .tag {
            display: inline-block;
            background: #eef2f5;
            color: #7f8c8d;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .bio {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Màu riêng cho từng nút */
        .btn-facebook { background: #1877f2; }
        .btn-zalo { background: #0068ff; }
        .btn-tiktok { background: #000000; }
        .btn-phone { background: #2ecc71; }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <img src="https://i.imgur.com/6VBx3io.png" alt="Avatar" class="avatar">
            <div class="status-dot" title="Đang hoạt động"></div>
        </div>

        <h1>Tên Của Bạn</h1>
        <span class="tag">📱 Content Creator / Developer</span>

        <p class="bio">
            "Xin chào tôi là Vũ Văn Mạnh! Đây là danh thiếp điện tử của tôi. Rất vui được kết nối với tất cả mọi người!"
        </p>

        <div class="links-container">
            <!-- Thay link Facebook của bạn ở bên dưới -->
            <a href="https://facebook.com" target="_blank" class="btn btn-facebook">
                Facebook cá nhân
            </a>

            <!-- Thay SĐT Zalo của bạn ở bên dưới -->
            <a href="https://zalo.me/0900000000" target="_blank" class="btn btn-zalo">
                Chat qua Zalo
            </a>

            <!-- Thay link TikTok của bạn ở bên dưới -->
            <a href="https://tiktok.com" target="_blank" class="btn btn-tiktok">
                Kênh TikTok
            </a>

            <!-- Thay SĐT gọi điện của bạn ở bên dưới -->
            <a href="tel:0900000000" class="btn btn-phone">
                📞 Gọi điện trực tiếp
            </a>
        </div>
    </div>

</body>
</html>
