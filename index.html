<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cá Nhân</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 1px solid #334155;
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin-bottom: 16px;
            border: 3px solid #38bdf8;
        }
        h1 { font-size: 22px; margin-bottom: 6px; }
        .sub { color: #38bdf8; font-size: 14px; font-weight: 600; margin-bottom: 16px; }
        .bio { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            background: #334155;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn:hover { background: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Avatar" alt="Avatar" class="avatar">
        <h1>Vũ Văn Mạnh </h1>
        <div class="sub">Lập Trình Viên / Sáng Tạo Nội Dung</div>
        <p class="bio">Đam mê công nghệ và sáng tạo. Luôn học hỏi những điều mới mỗi ngày!</p>
        <div class="links">
            <a href="https://facebook.com" target="_blank" class="btn">Facebook</a>
            <a href="https://zalo.me" target="_blank" class="btn">Zalo Liên Hệ</a>
            <a href="https://tiktok.com" target="_blank" class="btn">TikTok</a>
        </div>
    </div>
</body>
</html>
